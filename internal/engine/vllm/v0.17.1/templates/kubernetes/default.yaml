apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .EndpointName }}"
  namespace: {{ .Namespace }}
  labels:
    engine: {{ .EngineName }}
    engine_version: {{ .EngineVersion }}
    routing_logic: {{ .RoutingLogic }}
    app: inference
spec:
  replicas: {{ .Replicas }}
  progressDeadlineSeconds: {{ .ProgressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      cluster: {{ .ClusterName | quote }}
      workspace: {{ .Workspace | quote }}
      endpoint: "{{ .EndpointName }}"
      app: inference
  template:
    metadata:
      {{- if .Annotations }}
      annotations:
        {{- range $key, $value := .Annotations }}
        {{ $key }}: {{ $value }}
        {{- end }}
      {{- end }}
      labels:
        engine: {{ .EngineName }}
        engine_version: {{ .EngineVersion }}
        cluster: {{ .ClusterName | quote }}
        workspace: {{ .Workspace | quote }}
        endpoint: "{{ .EndpointName }}"
        routing_logic: {{ .RoutingLogic }}
        app: inference
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: endpoint
                      operator: In
                      values:
                        - "{{ .EndpointName }}"
                topologyKey: "kubernetes.io/hostname"
      {{- if .NodeSelector }}
      nodeSelector:
        {{- range $key, $value := .NodeSelector }}
        {{ $key }}: {{ $value }}
        {{- end }}
      {{- end }}
      {{- if .ImagePullSecret }}
      imagePullSecrets:
        - name: {{ .ImagePullSecret }}
      {{- end }}

      {{- if .Volumes }}
      volumes:
{{ .Volumes | toYaml | indent 6 }}
      {{- end }}
      initContainers:
        - name: model-downloader
          image: {{ .ImagePrefix }}/neutree/neutree-runtime:{{ .NeutreeVersion }}
          command:
            - bash
            - -c
          args:
            - >-
              python3 -m neutree.downloader
              --name="{{ .ModelArgs.name }}"
              --registry_type="{{ .ModelArgs.registry_type }}"
              --registry_path="{{ .ModelArgs.registry_path }}"
              --path="{{ .ModelArgs.path }}"
              --version="{{ .ModelArgs.version }}"
              --file="{{ .ModelArgs.file }}"
              --task="{{ .ModelArgs.task }}"
          env:
           {{ range $key, $value := .Env }}
           - name: {{ $key | quote }}
             value: {{ $value | quote }}
           {{ end }}
          {{- if .VolumeMounts }}
          volumeMounts:
{{ .VolumeMounts | toYaml | indent 10 }}
          {{- end }}

      containers:
        - name: {{ .EngineName }}
          image: {{ .ImagePrefix }}/{{ .ImageRepo }}:{{ .ImageTag }}
          command:
          - vllm
          - serve
          - {{ .ModelArgs.path }}
          - --host
          - "0.0.0.0"
          - "--port"
          - "8000"
          - --served-model-name
          - {{ .ModelArgs.serve_name }}
          {{/* vLLM v0.17.1 removed --task; auto-detect can fall back to a
               generate runner for multimodal embedding architectures, so
               translate the registry-level task explicitly. The shared
               serve/_utils/vllm_task_translate table mirrors these flags
               on the Ray Serve path. */}}
          {{- if eq .ModelArgs.task "text-embedding" }}
          - --runner
          - pooling
          - --convert
          - embed
          {{- else if eq .ModelArgs.task "text-rerank" }}
          - --runner
          - pooling
          - --convert
          - classify
          {{- end }}
          {{- if .EngineArgs }}
          {{- $storeTrueArgs := list
             "aggregate-engine-logging" "disable-log-stats" "headless"
          }}
          {{- $booleanOptionalArgs := list
             "allow-credentials" "allow-deprecated-quantization" "async-scheduling" "calculate-kv-scales" "cudagraph-metrics"
             "data-parallel-external-lb" "data-parallel-hybrid-lb" "disable-cascade-attn" "disable-chunked-mm-input"
             "disable-custom-all-reduce" "disable-fastapi-docs" "disable-frontend-multiprocessing" "disable-hybrid-kv-cache-manager"
             "disable-nccl-for-dp-synchronization" "disable-sliding-window" "disable-uvicorn-access-log" "enable-auto-tool-choice"
             "enable-chunked-prefill" "enable-dbo" "enable-elastic-ep" "enable-eplb" "enable-expert-parallel"
             "enable-flashinfer-autotune" "enable-force-include-usage" "enable-layerwise-nvtx-tracing" "enable-log-deltas"
             "enable-log-outputs" "enable-log-requests" "enable-logging-iteration-details" "enable-lora" "enable-mfu-metrics"
             "enable-mm-embeds" "enable-offline-docs" "enable-prefix-caching" "enable-prompt-embeds" "enable-prompt-tokens-details"
             "enable-request-id-headers" "enable-return-routed-experts" "enable-server-load-tracking" "enable-sleep-mode"
             "enable-ssl-refresh" "enable-tokenizer-info-endpoint" "enable-tower-connector-lora" "enforce-eager"
             "exclude-tools-when-tool-choice-none" "fail-on-environ-validation" "fully-sharded-loras" "interleave-mm-strings"
             "kv-cache-metrics" "kv-sharing-fast-prefill" "language-model-only" "log-error-stack" "mm-encoder-only"
             "ray-workers-use-nsight" "return-tokens-as-token-ids" "skip-mm-profiling" "skip-tokenizer-init" "specialize-active-lora"
             "tokens-only" "trust-remote-code" "trust-request-chat-template" "use-gpu-for-pooling-score" "use-tqdm-on-load"
          }}
          {{- range $key, $value := .EngineArgs }}
          {{- $flag := $key | replace "_" "-" }}
          {{- $text := printf "%v" $value }}
          {{- if kindIs "slice" $value }}
          {{- if gt (len $value) 0 }}
          - --{{ $key }}
          {{- range $item := $value }}
          - {{ $item | quote }}
          {{- end }}
          {{- end }}
          {{- else if and (has $flag $storeTrueArgs) (or (eq $text "true") (eq $text "false")) }}
          {{- if eq $text "true" }}
          - --{{ $key }}
          {{- end }}
          {{- else if and (has $flag $booleanOptionalArgs) (or (eq $text "true") (eq $text "false")) }}
          - --{{ if eq $text "false" }}no-{{ end }}{{ $key }}
          {{- else if and (hasPrefix "no-" $flag) (has (trimPrefix "no-" $flag) $booleanOptionalArgs)
                         (or (eq $text "true") (eq $text "false")) }}
          {{- if eq $text "true" }}
          - --{{ $key }}
          {{- end }}
          {{- else if and (eq $flag "hf-token") (kindIs "bool" $value) }}
          {{- if $value }}
          - --{{ $key }}
          {{- end }}
          {{- else }}
          - --{{ $key }}
          - "{{ $value }}"
          {{- end }}
          {{- end }}
          {{- end }}
          resources:
            limits:
              {{- range $key, $value := .Resources }}
              {{ $key }}: {{ $value }}
              {{- end }}
            requests:
              {{- range $key, $value := .Resources }}
              {{ $key }}: {{ $value }}
              {{- end }}
          env:
           {{ range $key, $value := .Env }}
           - name: {{ $key | quote }}
             value: {{ $value | quote }}
           {{ end }}
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: {{ .StartupProbeFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          {{- if .VolumeMounts }}
          volumeMounts:
{{ .VolumeMounts | toYaml | indent 10 }}
          {{- end }}
