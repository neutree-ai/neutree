apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .EndpointName }}"
  namespace: {{ .Namespace }}
  labels:
    engine: {{ .EngineName }}
    engine_version: {{ .EngineVersion }}
    routing_logic: {{ .RoutingLogic }}
    app: inference
spec:
  replicas: {{ .Replicas }}
  progressDeadlineSeconds: {{ .ProgressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      cluster: {{ .ClusterName | quote }}
      workspace: {{ .Workspace | quote }}
      endpoint: "{{ .EndpointName }}"
      app: inference
  template:
    metadata:
      {{- if .Annotations }}
      annotations:
        {{- range $key, $value := .Annotations }}
        {{ $key }}: {{ $value }}
        {{- end }}
      {{- end }}
      labels:
        engine: {{ .EngineName }}
        engine_version: {{ .EngineVersion }}
        cluster: {{ .ClusterName | quote }}
        workspace: {{ .Workspace | quote }}
        endpoint: "{{ .EndpointName }}"
        routing_logic: {{ .RoutingLogic }}
        app: inference
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: endpoint
                      operator: In
                      values:
                        - "{{ .EndpointName }}"
                topologyKey: "kubernetes.io/hostname"
      {{- if .NodeSelector }}
      nodeSelector:
        {{- range $key, $value := .NodeSelector }}
        {{ $key }}: {{ $value }}
        {{- end }}
      {{- end }}
      {{- if .ImagePullSecret }}
      imagePullSecrets:
        - name: {{ .ImagePullSecret }}
      {{- end }}

      {{- if .Volumes }}
      volumes:
{{ .Volumes | toYaml | indent 6 }}
      {{- end }}
      initContainers:
        - name: model-downloader
          image: {{ .ImagePrefix }}/neutree/neutree-runtime:{{ .NeutreeVersion }}
          command:
            - bash
            - -c
          args:
            - >-
              python3 -m neutree.downloader
              --name="{{ .ModelArgs.name }}"
              --registry_type="{{ .ModelArgs.registry_type }}"
              --registry_path="{{ .ModelArgs.registry_path }}"
              --path="{{ .ModelArgs.path }}"
              --version="{{ .ModelArgs.version }}"
              --file="{{ .ModelArgs.file }}"
              --task="{{ .ModelArgs.task }}"
          env:
           {{ range $key, $value := .Env }}
           - name: {{ $key | quote }}
             value: {{ $value | quote }}
           {{ end }}
          {{- if .VolumeMounts }}
          volumeMounts:
{{ .VolumeMounts | toYaml | indent 10 }}
          {{- end }}

      containers:
        - name: {{ .EngineName }}
          image: {{ .ImagePrefix }}/{{ .ImageRepo }}:{{ .ImageTag }}
          command:
          - python3
          - -m
          - sglang.launch_server
          - --host
          - "0.0.0.0"
          - --port
          - "8000"
          - --model-path
          - {{ .ModelArgs.path }}
          - --served-model-name
          - {{ .ModelArgs.serve_name }}
          {{- if eq .ModelArgs.task "text-embedding" }}
          - --is-embedding
          {{- end }}
          {{/* SGLang argparse only registers kebab-case long options
               (e.g. --tp-size); convert schema underscore keys at render
               time so the same dict drives the CLI here and the Python
               kwargs on the SSH/Ray path. */}}
          {{- if .EngineArgs }}
          {{- $storeTrueArgs := list
             "abort-on-priority-when-disabled" "allow-auto-truncate" "checkpoint-engine-wait-weights-before-ready"
             "collect-tokens-histogram" "constrained-json-disable-any-whitespace" "delete-ckpt-after-loading"
             "disable-chunked-prefix-cache" "disable-cuda-graph" "disable-cuda-graph-padding" "disable-custom-all-reduce"
             "disable-fast-image-processor" "disable-flashinfer-autotune" "disable-flashinfer-cutlass-moe-fp4-allgather"
             "disable-hybrid-swa-memory" "disable-outlines-disk-cache" "disable-overlap-schedule" "disable-piecewise-cuda-graph"
             "disable-priority-preemption" "disable-radix-cache" "disable-shared-experts-fusion" "disable-tokenizer-batch-decode"
             "disaggregation-decode-enable-offload-kvcache" "enable-adaptive-dispatch-to-encoder" "enable-aiter-allreduce-fusion"
             "enable-attn-tp-input-scattered" "enable-broadcast-mm-inputs-process" "enable-cache-report" "enable-cudagraph-gc"
             "enable-custom-logit-processor" "enable-deterministic-inference" "enable-double-sparsity" "enable-dp-attention"
             "enable-dp-lm-head" "enable-draft-weights-cpu-backup" "enable-dynamic-batch-tokenizer" "enable-dynamic-chunking"
             "enable-elastic-expert-backup" "enable-eplb" "enable-expert-distribution-metrics" "enable-flashinfer-allreduce-fusion"
             "enable-fp32-lm-head" "enable-fused-moe-sum-all-reduce" "enable-fused-qk-norm-rope" "enable-hierarchical-cache"
             "enable-hisparse" "enable-layerwise-nvtx-marker" "enable-lmcache" "enable-lora" "enable-lora-overlap-loading"
             "enable-memory-saver" "enable-metrics" "enable-metrics-for-all-schedulers" "enable-mfu-metrics" "enable-mixed-chunk"
             "enable-mm-global-cache" "enable-mscclpp" "enable-multi-layer-eagle" "enable-multimodal" "enable-nan-detection"
             "enable-nccl-nvls" "enable-nsa-prefill-context-parallel" "enable-p2p-check" "enable-pdmux"
             "enable-precise-embedding-interpolation" "enable-prefill-context-parallel" "enable-prefill-delayer" "enable-prefix-mm-cache"
             "enable-priority-scheduling" "enable-profile-cuda-graph" "enable-request-time-stats-logging" "enable-return-hidden-states"
             "enable-return-routed-experts" "enable-single-batch-overlap" "enable-ssl-refresh" "enable-streaming-session"
             "enable-symm-mem" "enable-tokenizer-batch-encode" "enable-torch-compile" "enable-torch-compile-debug-mode"
             "enable-torch-symm-mem" "enable-trace" "enable-two-batch-overlap" "enable-weights-cpu-backup" "encoder-only"
             "enforce-disable-flashinfer-allreduce-fusion" "enforce-piecewise-cuda-graph" "export-metrics-to-file"
             "flashinfer-mla-disable-ragged" "grpc-mode" "incremental-streaming-output" "is-embedding" "keep-mm-feature-on-device"
             "language-only" "log-requests" "mm-enable-dp-encoder" "pre-warm-nccl" "quantize-and-serve"
             "remote-instance-weight-loader-start-seed-via-transfer-engine" "schedule-low-priority-values-first" "show-time-cost"
             "skip-server-warmup" "skip-tokenizer-init" "sleep-on-idle" "stream-output" "stream-response-default-include-usage"
             "triton-attention-reduce-in-fp32" "trust-remote-code" "use-ray" "weight-loader-disable-mmap"
          }}
          {{- $booleanOptionalArgs := list
             "experts-shared-outer-loras"
          }}
          {{- range $key, $value := .EngineArgs }}
          {{- $flag := $key | replace "_" "-" }}
          {{- $text := printf "%v" $value }}
          {{- if and (has $flag $storeTrueArgs) (or (eq $text "true") (eq $text "false")) }}
          {{- if eq $text "true" }}
          - --{{ $flag }}
          {{- end }}
          {{- else if and (has $flag $booleanOptionalArgs) (or (eq $text "true") (eq $text "false")) }}
          - --{{ if eq $text "false" }}no-{{ end }}{{ $flag }}
          {{- else if and (hasPrefix "no-" $flag) (has (trimPrefix "no-" $flag) $booleanOptionalArgs)
                         (or (eq $text "true") (eq $text "false")) }}
          {{- if eq $text "true" }}
          - --{{ $flag }}
          {{- end }}
          {{- else }}
          - --{{ $flag }}
          - "{{ $value }}"
          {{- end }}
          {{- end }}
          {{- end }}
          resources:
            limits:
              {{- range $key, $value := .Resources }}
              {{ $key }}: {{ $value }}
              {{- end }}
            requests:
              {{- range $key, $value := .Resources }}
              {{ $key }}: {{ $value }}
              {{- end }}
          env:
           {{ range $key, $value := .Env }}
           - name: {{ $key | quote }}
             value: {{ $value | quote }}
           {{ end }}
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: {{ .StartupProbeFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          {{- if .VolumeMounts }}
          volumeMounts:
{{ .VolumeMounts | toYaml | indent 10 }}
          {{- end }}
