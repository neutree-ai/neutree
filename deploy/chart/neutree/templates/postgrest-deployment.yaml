apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neutree.fullname" . }}-postgrest
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  replicas: {{ include "neutree.replicaCount" (dict "root" $ "values" .Values.postgrest) }}
  {{- if include "neutree.ha.enabled" . }}
  {{- include "neutree.ha.strategy" . | nindent 2 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: neutree-postgrest
  template:
    metadata:
      labels:
        app.kubernetes.io/component: neutree-postgrest
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName:  {{ include "neutree.fullname" . }}-sa
      initContainers:
        {{- include "neutree.db.waitContainer" . | nindent 8 }}
      containers:
        - name: postgrest
          image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.postgrest.image.registry "repository" .Values.postgrest.image.repository "tag" .Values.postgrest.image.tag "defaultTag" .Values.postgrest.image.tag) }}
          imagePullPolicy: {{ .Values.postgrest.image.pullPolicy }}
          env:
            - name: PGRST_DB_URI
              value: {{ include "neutree.db.url" (dict "root" $ "user" .Values.db.user "password" .Values.db.password "keepalive" true) | quote }}
            - name: PGRST_DB_SCHEMA
              value: api
            - name: PGRST_SERVER_HOST
              value: "0.0.0.0"
            - name: PGRST_SERVER_PORT
              value: "6432"
            - name: PGRST_JWT_SECRET
              value: "{{ include "neutree.jwtSecret" . }}"
            - name: PGRST_APP_SETTINGS_JWT_SECRET
              value: "{{ include "neutree.jwtSecret" . }}"
            - name: PGRST_DB_EXTRA_SEARCH_PATH
              value: "auth"
            - name: PGRST_DB_AGGREGATES_ENABLED
              value: "1"
            - name: PGRST_DB_ANON_ROLE
              value: "anonymous"
            # Serves /live and /ready for the probes, off the API port.
            - name: PGRST_ADMIN_SERVER_PORT
              value: "6433"
          ports:
            - name: http
              containerPort: 6432
              protocol: TCP
            - name: admin
              containerPort: 6433
              protocol: TCP
          {{- with .Values.postgrest.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgrest.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgrest.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgrest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with (include "neutree.ha.podScheduling" (dict "root" $ "values" .Values.postgrest "component" "neutree-postgrest")) }}
      {{- . | trim | nindent 6 }}
      {{- end }}