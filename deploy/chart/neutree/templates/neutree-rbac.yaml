apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neutree.fullname" . }}-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "neutree.fullname" . }}-role
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get","list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","create","update","patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get","list","patch"]
  # The database migration Job freezes and then stops the PostgreSQL Deployment
  # of earlier releases, and waits for the CloudNativePG Cluster.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get","patch","update"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get","list","watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get","create","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "neutree.fullname" . }}-rolebinding
subjects:
  - kind: ServiceAccount
    name: {{ include "neutree.fullname" . }}-sa
    namespace: {{ .Release.Namespace}}
roleRef:
  kind: Role
  name: {{ include "neutree.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io