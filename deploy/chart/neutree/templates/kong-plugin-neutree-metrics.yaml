apiVersion: v1
kind: ConfigMap
data:
{{ (.Files.Glob "gateway/kong/plugins/neutree-metrics/*").AsConfig | indent 2 }}
{{ range $path, $_ := .Files.Glob "gateway/kong/plugins/neutree-metrics/collectors/*.lua" }}
  {{ printf "collectors.%s" (base $path) }}: |-
{{ $.Files.Get $path | indent 4 }}
{{ end }}
metadata:
  labels:
    app.kubernetes.io/component: kong-plugin
  name: neutree-metrics
