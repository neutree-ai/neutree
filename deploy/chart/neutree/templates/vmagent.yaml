{{ if or .Values.metrics.remoteWriteUrl (index .Values "victoria-metrics-cluster" "enabled") }}
{{- $ha := include "neutree.ha.enabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neutree.fullname" . }}-vmagent
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  {{- if $ha }}
  replicas: {{ include "neutree.vmagent.replicaCount" . }}
  {{- include "neutree.ha.strategy" . | nindent 2 }}
  {{- else }}
  strategy:
    type: Recreate
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: neutree-vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: neutree-vmagent
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: neutree-vmagent
          env:
            - name: NEUTREE_KONG_METRICS_HOST
              value: {{ printf "%s-kong-metrics.%s.svc.%s" (include "neutree.fullname" .) .Release.Namespace .Values.global.clusterDomain | quote }}
            {{- if $ha }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          args:
            - "--promscrape.config=/etc/prometheus/prometheus.yml"
            - "--promscrape.configCheckInterval=10s"
            {{- if $ha }}
            # Every replica scrapes every target. A distinct cluster name gives
            # each replica its own scrape offsets, so storage-side
            # deduplication keeps one replica's samples consistently.
            - "--promscrape.cluster.name=$(POD_NAME)"
            - "--remoteWrite.tmpDataPath=/vmagentdata"
            {{- end }}
            {{- $metricsRemoteWriteUrl := include "neutree.metricsRemoteWriteUrl" . }}
            {{- if $metricsRemoteWriteUrl }}
            - "--remoteWrite.url={{ $metricsRemoteWriteUrl }}"
            {{- end }}
          image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.vmagent.image.registry "repository" .Values.vmagent.image.repository "tag" .Values.vmagent.image.tag "defaultTag" .Values.vmagent.image.tag) }}
          imagePullPolicy: {{ .Values.vmagent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8429
              protocol: TCP
          {{- with (include "neutree.vmagent.readinessProbe" .) }}
          readinessProbe:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.vmagent.resources | nindent 12 }}
          volumeMounts:
            - name: vmagent-config
              mountPath: /etc/prometheus
            - name: vmagentdata
              mountPath: /vmagentdata
            - name: vmagent-scrape-config
              mountPath: /etc/prometheus/scrape
      volumes:
        - name: vmagentdata
          {{- if $ha }}
          # Holds only samples not yet accepted by vminsert; the other
          # replicas scrape the same targets, so losing it with the pod costs
          # nothing.
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "neutree.fullname" . }}-vmagent-pvc
          {{- end }}
        - name: vmagent-scrape-config
          configMap:
            name: vmagent-scrape-config
        - name: vmagent-config
          configMap:
            name: vmagent-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
      {{- if $ha }}
      {{- with (include "neutree.ha.podScheduling" (dict "root" $ "values" .Values.vmagent "component" "neutree-vmagent")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- else }}
      {{- with .Values.vmagent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vmagent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vmagent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
{{- if not $ha }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "neutree.fullname" . }}-vmagent-pvc
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  {{- if .Values.vmagent.persistence.storageClassName }}
  storageClassName: {{ .Values.vmagent.persistence.storageClassName }}
  {{- end }}
  accessModes:
  {{- range .Values.vmagent.persistence.accessModes }}
    - {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.vmagent.persistence.size | quote }}
{{- end }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: vmagent-config
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "vmagent/*").AsConfig | indent 2 }}
{{ end }}
