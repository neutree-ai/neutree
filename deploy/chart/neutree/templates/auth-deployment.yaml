apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{  .Release.Namespace }}
  name: {{ include "neutree.fullname" . }}-auth
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  replicas: {{ include "neutree.replicaCount" (dict "root" $ "values" .Values.auth) }}
  {{- if include "neutree.ha.enabled" . }}
  {{- include "neutree.ha.strategy" . | nindent 2 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: neutree-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/component: neutree-auth
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neutree.fullname" . }}-sa
      initContainers:
        {{- include "neutree.db.waitReadyContainer" . | nindent 8 }}
      containers:
        - name: auth
          image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.auth.image.registry "repository" .Values.auth.image.repository "tag" .Values.auth.image.tag "defaultTag" .Values.auth.image.tag) }}
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          env:
            - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
              value: "/verify"
            - name: GOTRUE_JWT_SECRET
              value: {{ include "neutree.jwtSecret" . }}
            - name: GOTRUE_JWT_EXP
              value: "3600"
            - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
              value: "api_user"
            - name: GOTRUE_DB_DRIVER
              value: "postgres"
            - name: DB_NAMESPACE
              value: auth
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: PORT
              value: "9999"
            - name: GOTRUE_DISABLE_SIGNUP
              value: "false"
            - name: API_EXTERNAL_URL
              value: "http://localhost:9999"
            - name: GOTRUE_SITE_URL
              value: "http://localhost:9999"
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: "true"
            - name: GOTRUE_LOG_LEVEL
              value: "INFO"
            # pgx sends unknown URL keys to the server as settings, which rejects
            # libpq's keepalive keys; pgx's own dialer keepalive applies instead.
            - name: DATABASE_URL
              value: {{ include "neutree.db.url" (dict "root" $ "user" "auth_admin" "password" "auth_admin_password" "params" (printf "sslmode=disable&connect_timeout=%d" (int .Values.auth.db.connectTimeoutSeconds))) | quote }}
            {{- with .Values.auth.db.maxPoolSize }}
            - name: GOTRUE_DB_MAX_POOL_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.db.maxIdlePoolSize }}
            - name: GOTRUE_DB_MAX_IDLE_POOL_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.db.connMaxIdleTime }}
            - name: GOTRUE_DB_CONN_MAX_IDLE_TIME
              value: {{ . | quote }}
            {{- end }}
            - name: GOTRUE_COOKIE_KEY
              value: {{.Values.db.name }}
          {{- with .Values.auth.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "wget -q -O /dev/null http://localhost:9999/health || exit 1"
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 15
            failureThreshold: 10
          ports:
            - name: http
              containerPort: 9999
              protocol: TCP
          {{- with .Values.auth.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with (include "neutree.ha.podScheduling" (dict "root" $ "values" .Values.auth "component" "neutree-auth")) }}
      {{- . | trim | nindent 6 }}
      {{- end }}

