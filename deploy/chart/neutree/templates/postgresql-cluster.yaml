{{- include "neutree.db.requireOperator" . -}}
{{- $instances := int (include "neutree.db.instances" .) -}}
{{- $live := lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace (include "neutree.db.clusterName" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neutree.db.superuserSecretName" . }}
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: {{ .Values.db.password | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "neutree.db.clusterName" . }}
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  instances: {{ $instances }}
  imageName: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.db.image.registry "repository" .Values.db.image.repository "tag" .Values.db.image.tag "defaultTag" .Values.db.image.tag) }}
  imagePullPolicy: {{ .Values.db.image.pullPolicy }}
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # The PDB of a lone instance forbids every eviction, so a node drain would
  # hang forever; the Deployment it replaces could always be evicted.
  enablePDB: {{ gt $instances 1 }}
  # A smart shutdown waits for every client to leave (180s by default), and
  # the pooled clients never do; meanwhile no new connection is accepted.
  smartShutdownTimeout: {{ int .Values.db.smartShutdownTimeoutSeconds }}
  {{- if gt $instances 1 }}
  # Restart or update the primary by switching over to a standby first
  # (seconds of unavailability) instead of restarting it in place.
  primaryUpdateMethod: switchover
  {{- end }}
  # Neutree components connect as the superuser.
  enableSuperuserAccess: true
  superuserSecret:
    name: {{ include "neutree.db.superuserSecretName" . }}
  {{- if or .Values.db.parameters (gt $instances 1) }}
  postgresql:
    {{- with .Values.db.parameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if gt $instances 1 }}
    # A commit returns once one standby has it, so a failover loses nothing.
    synchronous:
      method: any
      number: 1
      {{- if and $live (not (dig "spec" "postgresql" "synchronous" "" $live)) }}
      # Growing a single instance: "required" would stall every commit until
      # the first standby has copied the whole database. The migration Job
      # raises it to required once every instance is ready.
      dataDurability: preferred
      {{- else }}
      dataDurability: required
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if .Values.grafanaDatabase.enabled }}
  managed:
    roles:
      - name: {{ .Values.grafanaDatabase.user }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "neutree.grafanaDatabase.secretName" . }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.db.name }}
      owner: {{ .Values.db.user }}
      # Without this, CNPG generates an owner secret whose random password
      # replaces the superuser password when the owner is postgres.
      secret:
        name: {{ include "neutree.db.superuserSecretName" . }}
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: {{ include "neutree.fullname" . }}-postgresql-initdb
            key: 000_init.sql
  storage:
    size: {{ .Values.db.persistence.size | quote }}
    {{- with .Values.db.persistence.storageClassName }}
    storageClass: {{ . }}
    {{- end }}
  {{- with .Values.db.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: {{ if include "neutree.ha.enabled" . }}required{{ else }}preferred{{ end }}
    {{- with .Values.db.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.db.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with (dig "nodeAffinity" nil .Values.db.affinity) }}
    nodeAffinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
