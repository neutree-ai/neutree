{{- if .Values.grafana.enabled }}
{{- include "neutree.grafana.validateDashboardMounts" . }}
{{- range $path, $_ := .Files.Glob "grafana-dashboards/*" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neutree.grafana.dashboardConfigMapName" (base $path) }}
  labels:
    {{- include "neutree.labels" $ | nindent 4 }}
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
