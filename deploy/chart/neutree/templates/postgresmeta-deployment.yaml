apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neutree.fullname" . }}-postgresmeta
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: neutree-postgresmeta
  template:
    metadata:
      labels:
        app.kubernetes.io/component: neutree-postgresmeta
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neutree.fullname" . }}-sa
      initContainers:
        {{- include "neutree.db.waitReadyContainer" . | nindent 8 }}
      containers:
        - name: neutree-postgresmeta
          image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.postgresmeta.image.registry "repository" .Values.postgresmeta.image.repository "tag" .Values.postgresmeta.image.tag "defaultTag" .Values.postgresmeta.image.tag) }}
          imagePullPolicy: {{ .Values.postgresmeta.image.pullPolicy }}
          env:
            - name: PG_META_HOST
              value: "0.0.0.0"
            - name: PG_META_PORT
              value: "8080"
            - name: PG_META_DB_HOST
              value: {{ include "neutree.db.host" . }}
            - name: PG_META_DB_PORT
              value: {{ include "neutree.db.port" . | quote }}
            - name: PG_META_DB_NAME
              value: {{.Values.db.name }}
            - name: PG_META_DB_USER
              value: {{.Values.db.user }}
            - name: PG_META_DB_PASSWORD
              value: {{.Values.db.password }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.postgresmeta.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.postgresmeta.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresmeta.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresmeta.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}