---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neutree.fullname" . }}-kong-admin
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: kong-admin
    port: 8001
    targetPort: 8001
    protocol: TCP
  selector:
    app.kubernetes.io/component: {{ include "neutree.fullname" . }}-kong

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neutree.fullname" . }}-kong-manager
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: kong-manager
    port: 8002
    targetPort: 8002
    protocol: TCP
  selector:
    app.kubernetes.io/component: {{ include "neutree.fullname" . }}-kong
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neutree.fullname" . }}-kong-proxy
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  type: {{ .Values.kong.proxyService.type }}
  ports:
  - name: kong-proxy
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: kong-proxy-tls
    port: 443
    targetPort: 8443
    protocol: TCP
  selector:
    app.kubernetes.io/component: {{ include "neutree.fullname" . }}-kong
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neutree.fullname" . }}-kong
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  replicas: {{ include "neutree.replicaCount" (dict "root" $ "values" .Values.kong) }}
  {{- if include "neutree.ha.enabled" . }}
  {{- include "neutree.ha.strategy" . | nindent 2 }}
  {{- end }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ include "neutree.fullname" . }}-kong
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ include "neutree.fullname" . }}-kong
      annotations:
        checksum/neutree-metrics: {{ printf "%s%s" ((.Files.Glob "gateway/kong/plugins/neutree-metrics/*.lua").AsConfig) ((.Files.Glob "gateway/kong/plugins/neutree-metrics/collectors/*.lua").AsConfig) | sha256sum | quote }}
        checksum/neutree-ai-gateway-plugin: {{ printf "%s%s" ((.Files.Glob "gateway/kong/plugins/neutree-ai-gateway/*.lua").AsConfig) ((.Files.Glob "gateway/kong/plugins/neutree-ai-gateway/observation/*.lua").AsConfig) | sha256sum | quote }}
        checksum/neutree-ai-statistics-plugin: {{ (.Files.Glob "gateway/kong/plugins/neutree-ai-statistics/*").AsConfig | sha256sum | quote }}
        checksum/neutree-ai-access-plugin: {{ (.Files.Glob "gateway/kong/plugins/neutree-ai-access/*").AsConfig | sha256sum | quote }}
        checksum/neutree-ai-quota-plugin: {{ (.Files.Glob "gateway/kong/plugins/neutree-ai-quota/*").AsConfig | sha256sum | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "neutree.ha.podScheduling" (dict "root" $ "values" .Values.kong "component" (printf "%s-kong" (include "neutree.fullname" .)))) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "neutree.fullname" . }}-sa
      initContainers:
      {{- include "neutree.db.waitReadyContainer" . | nindent 6 }}
      - name: clear-stale-pid
        image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.kong.image.registry "repository" .Values.kong.image.repository "tag" .Values.kong.image.tag "defaultTag" .Values.kong.image.tag) }}
        imagePullPolicy: {{ .Values.kong.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        resources:
          {}
        command:
        - "rm"
        - "-vrf"
        - "$KONG_PREFIX/pids"
        env:
        - name: KONG_ADMIN_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_GUI_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_GUI_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001, [::]:8001"
        - name: KONG_CLUSTER_LISTEN
          value: "off"
        - name: KONG_DATABASE
          value: "postgres"
        - name: KONG_LUA_PACKAGE_PATH
          value: "/opt/?.lua;/opt/?/init.lua;;"
        - name: KONG_NGINX_WORKER_PROCESSES
          value: {{ include "neutree.kong.workerProcesses" . | quote }}
        {{- include "neutree.kong.pgEnv" . | nindent 8 }}
        - name: KONG_PORTAL_API_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PORTAL_API_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PORT_MAPS
          value: "80:8000, 443:8443"
        - name: KONG_PREFIX
          value: "/kong_prefix/"
        - name: KONG_PROXY_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PROXY_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000, [::]:8000, 0.0.0.0:8443 http2 ssl, [::]:8443 http2 ssl"
        - name: KONG_PROXY_STREAM_ACCESS_LOG
          value: "/dev/stdout basic"
        - name: KONG_PROXY_STREAM_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ROUTER_FLAVOR
          value: "traditional"
        - name: KONG_STATUS_ACCESS_LOG
          value: "off"
        - name: KONG_STATUS_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_STATUS_LISTEN
          value: "0.0.0.0:8100, [::]:8100"
        - name: KONG_STREAM_LISTEN
          value: "off"
        volumeMounts:
        - name: kong-kong-prefix-dir
          mountPath: /kong_prefix/
        - name: kong-kong-tmp
          mountPath: /tmp
      - name: wait-for-db
        image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.kong.image.registry "repository" .Values.kong.image.repository "tag" .Values.kong.image.tag "defaultTag" .Values.kong.image.tag) }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: KONG_ADMIN_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_GUI_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_GUI_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001, [::]:8001"
        - name: KONG_CLUSTER_LISTEN
          value: "off"
        - name: KONG_DATABASE
          value: "postgres"
        - name: KONG_LUA_PACKAGE_PATH
          value: "/opt/?.lua;/opt/?/init.lua;;"
        - name: KONG_NGINX_WORKER_PROCESSES
          value: {{ include "neutree.kong.workerProcesses" . | quote }}
        {{- include "neutree.kong.pgEnv" . | nindent 8 }}
        - name: KONG_PORTAL_API_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PORTAL_API_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PORT_MAPS
          value: "80:8000, 443:8443"
        - name: KONG_PREFIX
          value: "/kong_prefix/"
        - name: KONG_PROXY_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PROXY_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000, [::]:8000, 0.0.0.0:8443 http2 ssl, [::]:8443 http2 ssl"
        - name: KONG_PROXY_STREAM_ACCESS_LOG
          value: "/dev/stdout basic"
        - name: KONG_PROXY_STREAM_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ROUTER_FLAVOR
          value: "traditional"
        - name: KONG_STATUS_ACCESS_LOG
          value: "off"
        - name: KONG_STATUS_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_STATUS_LISTEN
          value: "0.0.0.0:8100, [::]:8100"
        - name: KONG_STREAM_LISTEN
          value: "off"
        - name: LUA_PATH
          value: "/neutree-kong-plugin/?.lua;;"
        - name: KONG_PLUGINS
          value: "bundled,neutree-metrics,neutree-ai-gateway,neutree-ai-statistics,neutree-ai-access,neutree-ai-quota"
        args: [ "/bin/bash", "-c", "export KONG_NGINX_DAEMON=on KONG_PREFIX=`mktemp -d` KONG_KEYRING_ENABLED=off; until kong start; do echo 'waiting for db'; sleep 1; done; kong stop"]
        volumeMounts:
          - name: kong-kong-prefix-dir
            mountPath: /kong_prefix/
          - name: kong-kong-tmp
            mountPath: /tmp
          - name: neutree-metrics
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-metrics
          - name: neutree-ai-gateway
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-ai-gateway
          - name: neutree-ai-statistics
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-ai-statistics
          - name: neutree-ai-access
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-ai-access
          - name: neutree-ai-quota
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-ai-quota
        resources:
          {}
      containers:
      - name: "proxy"
        image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.kong.image.registry "repository" .Values.kong.image.repository "tag" .Values.kong.image.tag "defaultTag" .Values.kong.image.tag) }}
        imagePullPolicy: {{ .Values.kong.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE
          value: "20m"
        - name: KONG_NGINX_HTTP_LUA_SHARED_DICT
          value: {{ printf "neutree_ai_gateway_inflight %s" .Values.kong.inflightSharedDictSize | quote }}
        - name: KONG_ADMIN_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_GUI_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_GUI_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001, [::]:8001"
        - name: KONG_CLUSTER_LISTEN
          value: "off"
        - name: KONG_DATABASE
          value: "postgres"
        {{- if include "neutree.ha.enabled" . }}
        # A Kong pod started during a rollout must authenticate keys without
        # PostgreSQL: rolling the database switches the primary, and a cold
        # cache turns that window into 500s on the new pod. acls also fills
        # the per-consumer group cache the acl plugin reads.
        - name: KONG_DB_CACHE_WARMUP_ENTITIES
          value: "services,consumers,keyauth_credentials,acls"
        {{- end }}
        - name: KONG_LUA_PACKAGE_PATH
          value: "/opt/?.lua;/opt/?/init.lua;;"
        - name: KONG_NGINX_WORKER_PROCESSES
          value: {{ include "neutree.kong.workerProcesses" . | quote }}
        {{- include "neutree.kong.pgEnv" . | nindent 8 }}
        - name: KONG_PORTAL_API_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PORTAL_API_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PORT_MAPS
          value: "80:8000, 443:8443"
        - name: KONG_PREFIX
          value: "/kong_prefix/"
        - name: KONG_PROXY_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PROXY_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000, [::]:8000, 0.0.0.0:8443 http2 ssl, [::]:8443 http2 ssl"
        - name: KONG_PROXY_STREAM_ACCESS_LOG
          value: "/dev/stdout basic"
        - name: KONG_PROXY_STREAM_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ROUTER_FLAVOR
          value: "traditional"
        - name: KONG_STATUS_ACCESS_LOG
          value: "off"
        - name: KONG_STATUS_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_STATUS_LISTEN
          value: "0.0.0.0:8100, [::]:8100"
        - name: KONG_STREAM_LISTEN
          value: "off"
        - name: LUA_PATH
          value: "/neutree-kong-plugin/?.lua;;"
        - name: KONG_PLUGINS
          value: "bundled,neutree-metrics,neutree-ai-gateway,neutree-ai-statistics,neutree-ai-access,neutree-ai-quota"
        {{- with .Values.kong.globalRateLimit }}
        {{- if .enabled }}
        # nginx hides the environment from Lua unless each variable is declared.
        - name: KONG_NGINX_MAIN_ENV
          value: "NEUTREE_GLOBAL_RATE_LIMIT; env NEUTREE_GLOBAL_RATE_LIMIT_TIMEOUT_MS; env NEUTREE_GLOBAL_RATE_LIMIT_COOLDOWN_SECONDS"
        - name: NEUTREE_GLOBAL_RATE_LIMIT
          value: "on"
        - name: NEUTREE_GLOBAL_RATE_LIMIT_TIMEOUT_MS
          value: {{ int .timeoutMs | quote }}
        - name: NEUTREE_GLOBAL_RATE_LIMIT_COOLDOWN_SECONDS
          value: {{ int .cooldownSeconds | quote }}
        {{- end }}
        {{- end }}
        lifecycle:
          preStop:
            exec:
              # Kong cannot send logs (usage records, traces) of requests that
              # finish after SIGQUIT: its timers stop once the worker is exiting.
              # So drain before quitting: wait for the endpoints to be withdrawn,
              # then until no request is in flight (connections reading or
              # writing, minus one events-broker connection per worker and this
              # status request), give the log queues a moment, then quit.
              command:
              - /bin/bash
              - -c
              - |
                inflight() {
                  local s r w n
                  exec 3<>/dev/tcp/127.0.0.1/8100 || return 1
                  printf 'GET /status HTTP/1.0\r\n\r\n' >&3
                  s=$(cat <&3)
                  exec 3<&-
                  r=$(grep -o '"connections_reading":[0-9]*' <<<"$s" | cut -d: -f2)
                  w=$(grep -o '"connections_writing":[0-9]*' <<<"$s" | cut -d: -f2)
                  n=$(grep -l '^nginx: worker process' /proc/[0-9]*/cmdline 2>/dev/null | wc -l)
                  echo $((r + w - n - 1))
                }
                sleep {{ int .Values.kong.shutdown.waitSeconds }}
                deadline=$((SECONDS + {{ int .Values.kong.shutdown.drainTimeoutSeconds }}))
                while [ "$SECONDS" -lt "$deadline" ]; do
                  [ "$(inflight)" = 0 ] && break
                  sleep 0.5
                done
                sleep 2
                exec kong quit --timeout=10
        ports:
        - name: admin
          containerPort: 8001
          protocol: TCP
        - name: manager
          containerPort: 8002
          protocol: TCP
        - name: proxy
          containerPort: 8000
          protocol: TCP
        - name: proxy-tls
          containerPort: 8443
          protocol: TCP
        - name: status
          containerPort: 8100
          protocol: TCP
        volumeMounts:
          - name: kong-kong-prefix-dir
            mountPath: /kong_prefix/
          - name: kong-kong-tmp
            mountPath: /tmp
          - name: neutree-metrics
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-metrics
          - name: neutree-ai-gateway
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-ai-gateway
          - name: neutree-ai-statistics
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-ai-statistics
          - name: neutree-ai-access
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-ai-access
          - name: neutree-ai-quota
            mountPath: /neutree-kong-plugin/kong/plugins/neutree-ai-quota
        # TCP, not /status: /status (and /status/ready, /metrics) connect to
        # PostgreSQL and hang while the primary's node is unreachable, which
        # took every Kong out of the Service and then restarted it, although
        # Kong serves inference from its cache. Kong only listens once it has
        # started against the database.
        readinessProbe:
          failureThreshold: 3
          tcpSocket:
            port: proxy
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          tcpSocket:
            port: status
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        {{- with .Values.kong.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ add .Values.kong.shutdown.waitSeconds .Values.kong.shutdown.drainTimeoutSeconds 15 }}
      volumes:
        - name: kong-kong-prefix-dir
          emptyDir:
            sizeLimit: 256Mi
        - name: kong-kong-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: neutree-metrics
          configMap:
            name: neutree-metrics
            items:
{{ range $path, $_ := .Files.Glob "gateway/kong/plugins/neutree-metrics/*.lua" }}
              - key: {{ base $path }}
                path: {{ base $path }}
{{ end }}
{{ range $path, $_ := .Files.Glob "gateway/kong/plugins/neutree-metrics/collectors/*.lua" }}
              - key: {{ printf "collectors.%s" (base $path) }}
                path: {{ printf "collectors/%s" (base $path) }}
{{ end }}
        - name: neutree-ai-gateway
          configMap:
            name: neutree-ai-gateway
            items:
{{ range $path, $_ := .Files.Glob "gateway/kong/plugins/neutree-ai-gateway/*.lua" }}
              - key: {{ base $path }}
                path: {{ base $path }}
{{ end }}
{{ range $path, $_ := .Files.Glob "gateway/kong/plugins/neutree-ai-gateway/observation/*.lua" }}
              - key: {{ printf "observation.%s" (base $path) }}
                path: {{ printf "observation/%s" (base $path) }}
{{ end }}
        - name: neutree-ai-statistics
          configMap:
            name: neutree-ai-statistics
        - name: neutree-ai-access
          configMap:
            name: neutree-ai-access
        - name: neutree-ai-quota
          configMap:
            name: neutree-ai-quota
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "neutree.fullname" . }}-kong-init-migrations-{{ .Release.Revision }}
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 20
  template:
    metadata:
      name: kong-init-migrations
      labels:
        app.kubernetes.io/component: kong-init-migrations
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "neutree.podScheduling" .Values.kong) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "neutree.fullname" . }}-sa
      initContainers:
        {{- include "neutree.db.waitContainer" . | nindent 8 }}
        - name: wait-migration-job
          image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.k8sWaitFor.image.registry "repository" .Values.k8sWaitFor.image.repository "tag" .Values.k8sWaitFor.image.tag "defaultTag" .Values.k8sWaitFor.image.tag) }}
          imagePullPolicy: {{ .Values.k8sWaitFor.image.pullPolicy }}
          args:
            - job-wr
            - {{ include "neutree.fullname" . }}-migration-job-{{ .Release.Revision }}
            - -n
            - {{ .Release.Namespace }}
      containers:
      - name: kong-migrations
        image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.kong.image.registry "repository" .Values.kong.image.repository "tag" .Values.kong.image.tag "defaultTag" .Values.kong.image.tag) }}
        imagePullPolicy: {{ .Values.kong.image.pullPolicy }}
        securityContext:

          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: KONG_ADMIN_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_GUI_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_GUI_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001, [::]:8001"
        - name: KONG_CLUSTER_LISTEN
          value: "off"
        - name: KONG_DATABASE
          value: "postgres"
        - name: KONG_LUA_PACKAGE_PATH
          value: "/opt/?.lua;/opt/?/init.lua;;"
        - name: KONG_NGINX_WORKER_PROCESSES
          value: {{ include "neutree.kong.workerProcesses" . | quote }}
        {{- include "neutree.kong.pgEnv" . | nindent 8 }}
        - name: KONG_PORTAL_API_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PORTAL_API_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PORT_MAPS
          value: "80:8000, 443:8443"
        - name: KONG_PREFIX
          value: "/kong_prefix/"
        - name: KONG_PROXY_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PROXY_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000, [::]:8000, 0.0.0.0:8443 http2 ssl, [::]:8443 http2 ssl"
        - name: KONG_PROXY_STREAM_ACCESS_LOG
          value: "/dev/stdout basic"
        - name: KONG_PROXY_STREAM_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ROUTER_FLAVOR
          value: "traditional"
        - name: KONG_STATUS_ACCESS_LOG
          value: "off"
        - name: KONG_STATUS_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_STATUS_LISTEN
          value: "0.0.0.0:8100, [::]:8100"
        - name: KONG_STREAM_LISTEN
          value: "off"
        args: [ "kong", "migrations", "bootstrap" ]
        volumeMounts:
        - name: kong-kong-prefix-dir
          mountPath: /kong_prefix/
        - name: kong-kong-tmp
          mountPath: /tmp
        resources:
          {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      volumes:
      - name: kong-kong-prefix-dir
        emptyDir:
          sizeLimit: 256Mi
      - name: kong-kong-tmp
        emptyDir:
          sizeLimit: 1Gi
