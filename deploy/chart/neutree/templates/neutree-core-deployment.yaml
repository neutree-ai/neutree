apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neutree.fullname" . }}-core
  labels:
    {{- include "neutree.labels" . | nindent 4 }}
spec:
  replicas: {{ include "neutree.replicaCount" (dict "root" $ "values" .Values.core) }}
  {{- if include "neutree.ha.enabled" . }}
  {{- include "neutree.ha.strategy" . | nindent 2 }}
  {{- else }}
  # Surge before terminating so the old leader releases its Lease to a running standby.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: neutree-core
  template:
    metadata:
      labels:
        app.kubernetes.io/component: neutree-core
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neutree.fullname" . }}-sa
      containers:
        - name: neutree-core
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.nodePort.externalHost }}
            - name: NODEPORT_EXTERNAL_HOST
              value: {{ .Values.nodePort.externalHost | quote }}
            {{- end }}
          args:
            - --storage-access-url=http://{{ include "neutree.fullname" . }}-postgrest-service:6432
            - --storage-jwt-secret={{ include "neutree.jwtSecret" . }}
            - --controller-workers=5
            - --leader-elect-lease-name={{ include "neutree.fullname" . }}-core-leader
            - --default-cluster-version=v1.0.0
            {{- $metricsRemoteWriteUrl := include "neutree.metricsRemoteWriteUrl" . }}
            {{- if $metricsRemoteWriteUrl }}
            - --metrics-remote-write-url={{ $metricsRemoteWriteUrl }}
            {{- end }}
            - --kubernetes-metrics-collect-configmap=vmagent-scrape-config
            - --kubernetes-collect-config-namespace={{ .Release.Namespace}}
            - --vector-logsinks-configmap={{ include "neutree.fullname" . }}-vector-logsinks
            - --vector-logsink-secret={{ include "neutree.fullname" . }}-vector-logsink-secrets
            - --vector-metrics-url=http://{{ include "neutree.fullname" . }}-vector:9598/metrics
            {{- if not (include "neutree.aiTraceStoreUrl" .) }}
            - --vector-trace-pipeline-enabled=false
            {{- end }}
            - --gateway-type=kong
            - --gateway-proxy-url={{ include "neutree.kong.proxyUrl" . }}
            - --gateway-admin-url=http://{{ include "neutree.fullname" . }}-kong-admin:8001
            - --gateway-log-remote-write-url=http://{{ include "neutree.fullname" . }}-vector:30122
            - --auth-endpoint=http://{{ include "neutree.fullname" . }}-auth-service:9999
            {{- if .Values.publicModelRegistries.enabled }}
            - --enable-builtin-public-model-registries
            - --hugging-face-endpoint={{ .Values.publicModelRegistries.huggingFace.url }}
            - --model-scope-endpoint={{ .Values.publicModelRegistries.modelScope.url }}
            {{- end }}
          image: {{ include "neutree.image" (dict "global" .Values.global "componentRegistry" .Values.core.image.registry "repository" .Values.core.image.repository "tag" .Values.core.image.tag "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.core.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          {{- with .Values.core.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 3001
              name: server
              protocol: TCP
          {{- with .Values.core.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.core.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with (include "neutree.ha.podScheduling" (dict "root" $ "values" .Values.core "component" "neutree-core")) }}
      {{- . | trim | nindent 6 }}
      {{- end }}
