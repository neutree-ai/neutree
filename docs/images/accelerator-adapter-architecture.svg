  <!-- Titles and control text -->
  <text x="60" y="134" class="lane-title">目标态 · 显式类型选择与厂商语义隔离</text>
  <text x="108" y="186" class="badge">P</text>
  <text x="139" y="178" class="node-title">Planner / Accelerator Profile</text>
  <text x="139" y="201" class="node-text">原子下发镜像 / 两类 type / target / runtime</text>
  <text x="535" y="186" class="badge">NA</text>
  <text x="568" y="163" class="node-title">NodeAgent 共享层 + Adapter Registry</text>
  <text x="568" y="185" class="node-text">accelerator_type 选择唯一 Adapter；CPU-only 不选择</text>
  <text x="568" y="206" class="node-text">cluster_type 断言 K8s / Static；只采当前 evidence</text>
  <text x="568" y="226" class="tiny">共享层不解释驱动、Exporter 字段、ResourceName、DeviceID、环境变量或进程语义</text>
  <path d="M 1325 179 L 1339 193 M 1339 179 L 1325 193" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="1362" y="178" class="node-title">GFD / NPU Feature Discovery</text>
  <text x="1362" y="199" class="node-text">目标数据面不部署、不读取、不 fallback</text>
  <text x="1362" y="218" class="tiny">仅参考 PCI/sysfs/产品识别实现</text>
  <text x="422" y="175" class="arrow-label">显式契约</text>
  <text x="700" y="255" class="arrow-label">nvidia_gpu</text>
  <text x="1009" y="255" class="arrow-label">npu</text>

  <!-- NVIDIA target text -->
  <text x="88" y="314" class="group-title">NVIDIA 目标分支</text>
  <text x="515" y="314" class="tiny">首期：物理 GPU / HAMi core；MIG 待建模</text>
  <text x="119" y="386" class="badge">NV</text>
  <text x="148" y="378" class="node-title">NVML + sysfs</text>
  <text x="148" y="399" class="node-text">UUID / 型号 / 内存 / PCI</text>
  <text x="148" y="416" class="tiny">NUMA</text>
  <text x="349" y="386" class="badge">D</text>
  <text x="378" y="378" class="node-title">DCGM Exporter</text>
  <text x="378" y="399" class="node-text">动态设备指标原文</text>
  <text x="579" y="386" class="badge">E</text>
  <text x="608" y="372" class="node-title">调度 / 进程原始证据</text>
  <text x="608" y="393" class="node-text">K8s PodResources/HAMi · Static Ray</text>
  <text x="608" y="412" class="tiny">visible env / nvidia-smi 原文</text>
  <text x="225" y="505" class="node-title text-white">NVIDIA Adapter · nvidia_gpu · 单注册对象</text>
  <text x="230" y="542" class="node-title">DiscoverHardware</text>
  <text x="397" y="542" class="node-text">NVML 驱动探测，Exporter-independent</text>
  <text x="230" y="568" class="node-title">Cluster capabilities</text>
  <text x="397" y="568" class="node-text">BuildKubernetesMetrics · BuildStaticMetrics</text>
  <text x="106" y="654" class="node-title">HardwareSnapshot</text>
  <text x="106" y="677" class="tiny">共享层组装 NodeDeviceSnapshot</text>
  <text x="341" y="654" class="node-title">AcceleratorMetricResult</text>
  <text x="341" y="677" class="tiny">共享层校验并输出 neutree_*</text>
  <text x="601" y="654" class="node-title">vmagent raw</text>
  <text x="601" y="677" class="tiny">DCGM 原样保留</text>

  <!-- NPU target text -->
  <text x="908" y="314" class="group-title">Ascend NPU 目标分支</text>
  <text x="939" y="386" class="badge">NP</text>
  <text x="968" y="378" class="node-title">驱动 / DCMI + sysfs</text>
  <text x="968" y="399" class="node-text">静态 inventory 权威来源</text>
  <text x="1169" y="386" class="badge">X</text>
  <text x="1198" y="378" class="node-title">NPU Exporter</text>
  <text x="1198" y="399" class="node-text">动态 / process 原文</text>
  <text x="1399" y="386" class="badge">E</text>
  <text x="1428" y="372" class="node-title">调度 / 进程原始证据</text>
  <text x="1428" y="393" class="node-text">K8s PodResources/HAMi · Static Ray</text>
  <text x="1428" y="412" class="tiny">逐 Pod annotation / vdie</text>
  <text x="1045" y="505" class="node-title text-white">Enterprise NPU Adapter · npu · 单注册对象</text>
  <text x="1050" y="542" class="node-title">DiscoverHardware</text>
  <text x="1217" y="542" class="node-text">driver/DCMI 探测，Exporter-independent</text>
  <text x="1050" y="568" class="node-title">Cluster capabilities</text>
  <text x="1217" y="568" class="node-text">BuildKubernetesMetrics · BuildStaticMetrics</text>
  <text x="926" y="654" class="node-title">HardwareSnapshot</text>
  <text x="926" y="677" class="tiny">共享层组装 NodeDeviceSnapshot</text>
  <text x="1161" y="654" class="node-title">AcceleratorMetricResult</text>
  <text x="1161" y="677" class="tiny">共享层校验并输出 neutree_*</text>
  <text x="1421" y="654" class="node-title">vmagent raw</text>
  <text x="1421" y="677" class="tiny">Exporter 原样保留</text>

  <!-- Legacy text -->
  <text x="60" y="820" class="lane-title">NVIDIA 当前兼容路径 · 迁移完成前保留，禁止与显式 nvidia_gpu Adapter 同时运行</text>
  <text x="86" y="873" class="node-title">DCGM Exporter</text>
  <text x="86" y="897" class="node-text">设备发现 + 动态指标原文</text>
  <text x="346" y="873" class="node-title">server.go scrape</text>
  <text x="346" y="897" class="node-text">Exporter Up 是后续入口条件</text>
  <text x="610" y="856" class="node-title">共享层直接持有 NVIDIA 语义</text>
  <text x="610" y="879" class="node-text">devicesnapshot.FromAcceleratorMetrics → nvidia_gpu 快照</text>
  <text x="610" y="900" class="node-text">hardware.FromAcceleratorMetrics + NVML merge</text>
  <text x="610" y="921" class="node-text">normalizer DCGM switch + allocation visible env / nvidia-smi</text>
  <text x="1131" y="873" class="node-title">neutree_* + snapshot</text>
  <text x="1131" y="897" class="node-text">现有行为保持兼容</text>
  <text x="1391" y="856" class="node-title">迁移退出门</text>
  <text x="1391" y="879" class="node-text">golden parity + allocation E2E</text>
  <text x="1391" y="900" class="node-text">Exporter down 仍有 NVML inventory</text>
  <text x="1391" y="921" class="node-text">通过后才删除 legacy</text>
  <text x="86" y="988" class="node-title">GFD 风格 labels（兼容）</text>
  <text x="86" y="1012" class="tiny">gpu.present / gpu.product</text>
  <text x="366" y="988" class="node-title">Profile placement / HAMi product</text>
  <text x="366" y="1012" class="tiny">不能作为设备 identity</text>
  <text x="646" y="988" class="node-title">NVML provider</text>
  <text x="646" y="1012" class="tiny">当前仅 Exporter Up 时调用</text>
  <text x="1331" y="873" class="arrow-label">验收门</text>

  <!-- Legend -->
  <text x="50" y="1114" class="lane-title">图例</text>
