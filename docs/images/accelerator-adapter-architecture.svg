  <text x="378" y="1114" class="node-text">驱动发现 / inventory</text>
  <line x1="585" y1="1109" x2="635" y2="1109" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="648" y="1114" class="node-text">evidence / result</text>
  <line x1="820" y1="1109" x2="870" y2="1109" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="883" y="1114" class="node-text">raw 指标旁路</text>
  <line x1="1045" y1="1109" x2="1095" y2="1109" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <text x="1108" y="1114" class="node-text">legacy 兼容依赖</text>
  <rect x="1300" y="1097" width="22" height="22" rx="4" class="box-red"/>
  <text x="1333" y="1114" class="node-text">目标数据面排除项</text>
  <text x="50" y="1152" class="tiny">每个 accelerator_type 只注册一个基础对象，再按 cluster_type 断言能力；NVIDIA 显式路径仍为目标态，legacy 以灰色虚线区域保留。</text>
</svg>
