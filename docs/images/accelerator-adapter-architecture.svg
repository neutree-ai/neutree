  <text x="40" y="48" class="title">加速器 Adapter 统一目标与 NVIDIA 迁移</text>
  <text x="40" y="77" class="subtitle">统一接口不等于当前实现：目标态按厂商隔离语义，NVIDIA legacy DCGM 在验收前互斥保留</text>

