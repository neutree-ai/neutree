<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">加速器 Adapter 统一目标与 NVIDIA 迁移</title>
  <desc id="diagram-desc">上半部分展示 Planner 向 NodeAgent 下发显式 accelerator_type 和 cluster_type 后，每个厂商只选择一个 Adapter 注册对象，再断言 Kubernetes 或 Static 能力接口。NVIDIA Adapter 和 NPU Adapter 分别调用厂商驱动、解释当前集群的强类型 evidence，并输出统一快照和指标。下半部分展示 NVIDIA 当前仍由共享层直接解析 DCGM、合并受 Exporter 成功约束的 NVML 信息并解释 allocation，迁移完成前保留为互斥的 legacy 路径。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #6b7280; }
      .lane-title { font-size: 16px; font-weight: 700; }
      .group-title { font-size: 18px; font-weight: 700; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-text { font-size: 12.5px; fill: #4b5563; }
      .tiny { font-size: 11.5px; fill: #6b7280; }
      .arrow-label { font-size: 11.5px; font-weight: 600; }
      .badge { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .text-white { fill: #ffffff; }
      .lane { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; }
      .vendor-nvidia { fill: #f8fbff; stroke: #93c5fd; stroke-width: 1.5; }
      .vendor-npu { fill: #f7fefb; stroke: #6ee7b7; stroke-width: 1.5; }
      .legacy-lane { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .box-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .box-green { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.5; }
      .box-orange { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; }
      .box-gray { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
      .box-red { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; }
      .adapter-blue { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .adapter-green { fill: #ffffff; stroke: #059669; stroke-width: 2; }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .arrow-orange { fill: none; stroke: #ea580c; stroke-width: 2.2; marker-end: url(#arrow-orange); }
      .arrow-gray { fill: none; stroke: #6b7280; stroke-width: 2; marker-end: url(#arrow-gray); }
      .arrow-purple { fill: none; stroke: #7c3aed; stroke-width: 2; marker-end: url(#arrow-purple); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>

