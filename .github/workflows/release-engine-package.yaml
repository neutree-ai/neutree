name: release-engine-package

on:
  workflow_call:
    inputs:
      engine:
        description: "engine name"
        required: true
        type: string
      accelerator:
        description: "accelerator segment used in the stable package path"
        required: true
        type: string
      engine_version:
        description: "upstream engine version (for example v0.24.0)"
        required: true
        type: string
      base_image_tag_override:
        description: "optional upstream base image tag override"
        required: false
        default: ""
        type: string
      ray_short_version:
        description: "short ray version used in image tags"
        required: false
        default: "ray2.53.0"
        type: string
      engine_patch_suffix:
        description: "optional neutree patch suffix appended to package and image tags"
        required: false
        default: ""
        type: string
      file_server_url:
        description: "base URL of the internal engine package file server"
        required: true
        type: string

jobs:
  release-package:
    runs-on: ["serve-builder", "X64"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve package metadata
        id: package
        shell: bash
        env:
          ENGINE: ${{ inputs.engine }}
          ACCELERATOR: ${{ inputs.accelerator }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
          BASE_IMAGE_TAG_OVERRIDE: ${{ inputs.base_image_tag_override }}
          RAY_SHORT_VERSION: ${{ inputs.ray_short_version }}
          ENGINE_PATCH_SUFFIX: ${{ inputs.engine_patch_suffix }}
          FILE_SERVER_URL: ${{ inputs.file_server_url }}
          IMAGE_REPO: ${{ secrets.SERVE_IMAGE_REPO }}
          IMAGE_PROJECT: ${{ secrets.RELEASE_SERVE_IMAGE_PROJECT }}
        run: |
          set -euo pipefail

          manifest_version="$ENGINE_VERSION"
          if [[ -n "$ENGINE_PATCH_SUFFIX" ]]; then
            manifest_version="${ENGINE_VERSION}-${ENGINE_PATCH_SUFFIX}"
          fi
          base_version="${ENGINE_VERSION%%-*}"
          schema_path="internal/engine/$ENGINE/$base_version/schema.json"
          template_dir="internal/engine/$ENGINE/$base_version/templates"
          [[ -f "$schema_path" ]] || { echo "engine schema is missing: $schema_path" >&2; exit 1; }
          [[ -d "$template_dir" ]] || { echo "engine templates are missing: $template_dir" >&2; exit 1; }
          find "$template_dir" -type f \( -name '*.yaml' -o -name '*.yml' \) -print -quit | grep -q . || {
            echo "engine templates are missing: $template_dir" >&2
            exit 1
          }

          make_args=(
            -s
            -C cluster-image-builder
            print-engine-image-ref
            "ENGINE_TYPE=$ENGINE"
            "ENGINE_ACCELERATOR=$ACCELERATOR"
            "IMAGE_REPO=$IMAGE_REPO"
            "IMAGE_PROJECT=$IMAGE_PROJECT"
            "RAY_SHORT_VERSION=$RAY_SHORT_VERSION"
            "ENGINE_PATCH_SUFFIX=$ENGINE_PATCH_SUFFIX"
          )

          case "$ENGINE:$ACCELERATOR" in
            vllm:nvidia)
              supported_tasks="text-generation,text-embedding,text-rerank"
              make_args+=(
                "ENGINE_VLLM_VERSION=$ENGINE_VERSION"
                "ENGINE_VLLM_BASE_IMAGE_TAG=${BASE_IMAGE_TAG_OVERRIDE:-$ENGINE_VERSION}"
              )
              ;;
            vllm:rocm)
              supported_tasks="text-generation,text-embedding,text-rerank"
              make_args+=(
                "ENGINE_VLLM_VERSION=$ENGINE_VERSION"
                "ENGINE_VLLM_ROCM_BASE_IMAGE_TAG=${BASE_IMAGE_TAG_OVERRIDE:-$ENGINE_VERSION}"
              )
              ;;
            sglang:nvidia)
              supported_tasks="text-generation,text-embedding"
              make_args+=(
                "ENGINE_SGLANG_VERSION=$ENGINE_VERSION"
                "ENGINE_SGLANG_BASE_IMAGE_TAG=${BASE_IMAGE_TAG_OVERRIDE:-$ENGINE_VERSION}"
              )
              ;;
            sglang:rocm)
              supported_tasks="text-generation,text-embedding"
              sglang_rocm_tag="$ENGINE_VERSION-rocm720-mi30x"
              if [[ -n "$BASE_IMAGE_TAG_OVERRIDE" ]]; then
                sglang_rocm_tag="$BASE_IMAGE_TAG_OVERRIDE"
              fi
              make_args+=(
                "ENGINE_SGLANG_VERSION=$ENGINE_VERSION"
                "ENGINE_SGLANG_ROCM_TAG=$sglang_rocm_tag"
              )
              ;;
            llama-cpp:cpu)
              supported_tasks="text-generation,text-embedding"
              make_args+=(
                "ENGINE_LLAMA_CPP_VERSION=$ENGINE_VERSION"
              )
              ;;
          esac

          image_spec="$(make "${make_args[@]}")"
          image_ref="${image_spec#*:}"
          image_tag="${image_ref##*:}"
          archive_name="$ENGINE-$manifest_version.tar.gz"
          package_url="${FILE_SERVER_URL%/}/engine-packages/$ENGINE/$manifest_version/$ACCELERATOR/$image_tag/$archive_name"
          output_dir="$RUNNER_TEMP/engine-package"

          mkdir -p "$output_dir"
          {
            printf 'manifest_version=%s\n' "$manifest_version"
            printf 'image_ref=%s\n' "$image_ref"
            printf 'image_spec=%s\n' "$image_spec"
            printf 'package_url=%s\n' "$package_url"
            printf 'output_dir=%s\n' "$output_dir"
            printf 'schema_path=%s\n' "$schema_path"
            printf 'template_dir=%s\n' "$template_dir"
            printf 'supported_tasks=%s\n' "$supported_tasks"
          } >> "$GITHUB_OUTPUT"

      - name: Login docker
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SERVE_IMAGE_REPO }}
          username: ${{ secrets.SERVE_IMAGE_PUSH_USERNAME }}
          password: ${{ secrets.SERVE_IMAGE_PUSH_TOKEN }}

      - name: Build neutree-cli
        run: make build-neutree-cli

      - name: Build engine package
        shell: bash
        env:
          ENGINE: ${{ inputs.engine }}
          MANIFEST_VERSION: ${{ steps.package.outputs.manifest_version }}
          IMAGE_SPEC: ${{ steps.package.outputs.image_spec }}
          PACKAGE_URL: ${{ steps.package.outputs.package_url }}
          OUTPUT_DIR: ${{ steps.package.outputs.output_dir }}
          SCHEMA_PATH: ${{ steps.package.outputs.schema_path }}
          TEMPLATE_DIR: ${{ steps.package.outputs.template_dir }}
          SUPPORTED_TASKS: ${{ steps.package.outputs.supported_tasks }}
        run: |
          set -euo pipefail
          archive_name="$ENGINE-$MANIFEST_VERSION.tar.gz"
          OUTPUT_DIR="$OUTPUT_DIR" bash scripts/builder/build-engine-package.sh \
            --name "$ENGINE" \
            --version "$MANIFEST_VERSION" \
            --images "$IMAGE_SPEC" \
            --supported-tasks "$SUPPORTED_TASKS" \
            --platform linux/amd64 \
            --force-pull \
            --schema "$SCHEMA_PATH" \
            --template-dir "$TEMPLATE_DIR" \
            --package-url "$PACKAGE_URL" \
            --output "$archive_name" \
            --description "$ENGINE inference engine"
          "$GITHUB_WORKSPACE/bin/neutree-cli" import validate -p "$OUTPUT_DIR/$archive_name"

      - name: Upload engine package
        shell: bash
        env:
          ENGINE: ${{ inputs.engine }}
          MANIFEST_VERSION: ${{ steps.package.outputs.manifest_version }}
          PACKAGE_URL: ${{ steps.package.outputs.package_url }}
          OUTPUT_DIR: ${{ steps.package.outputs.output_dir }}
        run: |
          set -euo pipefail
          archive="$OUTPUT_DIR/$ENGINE-$MANIFEST_VERSION.tar.gz"
          checksum="$archive.sha256"
          manifest="$OUTPUT_DIR/$ENGINE-$MANIFEST_VERSION-manifest.yaml"
          curl -T "$archive" "$PACKAGE_URL"
          curl -T "$checksum" "$PACKAGE_URL.sha256"
          curl -T "$manifest" "${PACKAGE_URL%.tar.gz}-manifest.yaml"
