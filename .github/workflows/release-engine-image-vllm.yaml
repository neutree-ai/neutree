name: release-engine-image-vllm

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: "accelerator type"
        required: true
        type: choice
        options:
          - nvidia
          - rocm
      engine_version:
        description: "vLLM engine version (e.g. v0.11.2)"
        required: true
        type: string
      base_image_tag_override:
        description: "optional override for the upstream vLLM base image tag (default: <engine_version>); must be a tag of the same upstream version as engine_version because the Neutree serve-layer code is still selected by engine_version via ENGINE_VLLM_DIR_VERSION (e.g. dev/preview tags of v0.11.2 are fine, a v0.12.0 tag is not)"
        required: false
        type: string
        default: ""
      ray_short_version:
        description: "ray short version for image tag (e.g: ray2.53.0)"
        required: false
        type: string
        default: "ray2.53.0"
      engine_patch_suffix:
        description: "optional raw Docker tag segment appended to the output tag (e.g. 'custom1' produces <engine_version>-custom1-<ray_short_version>); empty keeps the upstream tag; pass 'neutree1' explicitly for the legacy form"
        required: false
        type: string
        default: ""

jobs:
  build-amd64-image:
    runs-on: ["serve-builder","X64"]
    name: build amd64 vllm engine image
    steps:
      - uses: actions/checkout@v2
      - name: Validate release inputs
        shell: bash
        env:
          ENGINE_VERSION: ${{ github.event.inputs.engine_version }}
          BASE_IMAGE_TAG_OVERRIDE: ${{ github.event.inputs.base_image_tag_override }}
          RAY_SHORT_VERSION: ${{ github.event.inputs.ray_short_version }}
          ENGINE_PATCH_SUFFIX: ${{ github.event.inputs.engine_patch_suffix }}
        run: |
          set -euo pipefail
          [[ "$ENGINE_VERSION" =~ ^v[A-Za-z0-9._-]+$ ]] || { echo "engine_version must start with v and match [A-Za-z0-9._-]+"; exit 1; }
          [[ -z "$ENGINE_PATCH_SUFFIX" || "$ENGINE_PATCH_SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "engine_patch_suffix must match [A-Za-z0-9._-]+"; exit 1; }
          [[ "$RAY_SHORT_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "ray_short_version must be a Docker tag segment"; exit 1; }
          [[ -z "$BASE_IMAGE_TAG_OVERRIDE" || "$BASE_IMAGE_TAG_OVERRIDE" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "base_image_tag_override must be a Docker tag when set"; exit 1; }
          [[ -z "$BASE_IMAGE_TAG_OVERRIDE" || "$BASE_IMAGE_TAG_OVERRIDE" == "$ENGINE_VERSION" || "$BASE_IMAGE_TAG_OVERRIDE" == "$ENGINE_VERSION".* || "$BASE_IMAGE_TAG_OVERRIDE" == "$ENGINE_VERSION"-* ]] || { echo "base_image_tag_override must use the same upstream version as engine_version"; exit 1; }
      - name: Login docker
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.SERVE_IMAGE_REPO }}
          username: ${{ secrets.SERVE_IMAGE_PUSH_USERNAME }}
          password: ${{ secrets.SERVE_IMAGE_PUSH_TOKEN }}
      - name: Resolve make target suffix
        id: target
        run: |
          if [ "${{ github.event.inputs.accelerator }}" = "rocm" ]; then
            echo "suffix=-rocm" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi
      - name: build and push engine image
        run: |
          cd cluster-image-builder
          make docker-build-engine-vllm${{ steps.target.outputs.suffix }} docker-push-engine-vllm${{ steps.target.outputs.suffix }}
        env:
          IMAGE_PROJECT: ${{ secrets.RELEASE_SERVE_IMAGE_PROJECT }}
          IMAGE_REPO: ${{ secrets.SERVE_IMAGE_REPO }}
          ARCH: amd64
          ENGINE_VLLM_VERSION: ${{ github.event.inputs.engine_version }}
          ENGINE_VLLM_BASE_IMAGE_TAG: ${{ github.event.inputs.base_image_tag_override || github.event.inputs.engine_version }}
          ENGINE_VLLM_ROCM_BASE_IMAGE_TAG: ${{ github.event.inputs.base_image_tag_override || github.event.inputs.engine_version }}
          RAY_VERSION: ray-2.53.0-neutree
          RAY_SHORT_VERSION: ${{ github.event.inputs.ray_short_version }}
          ENGINE_PATCH_SUFFIX: ${{ github.event.inputs.engine_patch_suffix }}
  push-manifests:
    runs-on: ["serve-builder","X64"]
    name: merge and push vllm manifests
    needs:
      - build-amd64-image
    steps:
      - uses: actions/checkout@v2
      - name: Login docker
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.SERVE_IMAGE_REPO }}
          username: ${{ secrets.SERVE_IMAGE_PUSH_USERNAME }}
          password: ${{ secrets.SERVE_IMAGE_PUSH_TOKEN }}
      - name: Resolve manifest target suffix
        id: target
        run: |
          if [ "${{ github.event.inputs.accelerator }}" = "rocm" ]; then
            echo "suffix=-rocm" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi
      - name: push manifests
        run: |
          cd cluster-image-builder
          make docker-push-manifest-engine-vllm${{ steps.target.outputs.suffix }}
        env:
          IMAGE_PROJECT: ${{ secrets.RELEASE_SERVE_IMAGE_PROJECT }}
          IMAGE_REPO: ${{ secrets.SERVE_IMAGE_REPO }}
          ALL_ARCH: amd64
          ENGINE_VLLM_VERSION: ${{ github.event.inputs.engine_version }}
          ENGINE_VLLM_BASE_IMAGE_TAG: ${{ github.event.inputs.base_image_tag_override || github.event.inputs.engine_version }}
          ENGINE_VLLM_ROCM_BASE_IMAGE_TAG: ${{ github.event.inputs.base_image_tag_override || github.event.inputs.engine_version }}
          RAY_SHORT_VERSION: ${{ github.event.inputs.ray_short_version }}
          ENGINE_PATCH_SUFFIX: ${{ github.event.inputs.engine_patch_suffix }}

  release-package:
    if: ${{ vars.ENGINE_PACKAGE_FILE_SERVER_URL != '' }}
    needs:
      - push-manifests
    uses: ./.github/workflows/release-engine-package.yaml
    with:
      engine: vllm
      accelerator: ${{ github.event.inputs.accelerator }}
      engine_version: ${{ github.event.inputs.engine_version }}
      base_image_tag_override: ${{ github.event.inputs.base_image_tag_override }}
      ray_short_version: ${{ github.event.inputs.ray_short_version }}
      engine_patch_suffix: ${{ github.event.inputs.engine_patch_suffix }}
      file_server_url: ${{ vars.ENGINE_PACKAGE_FILE_SERVER_URL }}
    secrets: inherit
