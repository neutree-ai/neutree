name: release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v0.1.0-nightly-20250405
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag (e.g : v0.1.0-nightly-20250405)"
        required: true
        type: string
      ui_version:
        description: "the ui release version (optional, defaults to the release tag)"
        required: false
        type: string
jobs:
  resolve_versions:
    runs-on: ubuntu-latest
    name: resolve release versions
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      ui_version: ${{ steps.resolve.outputs.ui_version }}
    steps:
      - name: Resolve release tag and UI version
        id: resolve
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.tag }}
          RELEASE_TAG_REF: ${{ github.ref_name }}
          UI_VERSION_INPUT: ${{ github.event.inputs.ui_version }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${RELEASE_TAG_INPUT:-$RELEASE_TAG_REF}"
          [[ -n "$release_tag" ]] || {
            echo "release tag must not be empty" >&2
            exit 1
          }
          ui_version="${UI_VERSION_INPUT:-$release_tag}"

          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'ui_version=%s\n' "$ui_version"
          } >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s ui_version=%s\n' "$release_tag" "$ui_version"

  build-amd64-image:
    needs: resolve_versions
    env:
      UI_VERSION: ${{ needs.resolve_versions.outputs.ui_version }}
    runs-on: ubuntu-22.04
    name: build amd64 image
    steps:
      - uses: actions/checkout@v2
      - name: Check out specific tag when manually triggered
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --all && git checkout ${{ needs.resolve_versions.outputs.release_tag }}
      - name: Login docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.IMAGE_PUSH_USERNAME }}
          password: ${{ secrets.IMAGE_PUSH_TOKEN }}
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build amd64 image
        run: export ARCH=amd64; make docker-build && make docker-push
        env:
          IMAGE_PROJECT: ${{ secrets.RELEASE_IMAGE_PROJECT }}
          IMAGE_REPO: ${{ secrets.IMAGE_REPO }}
  build-arm64-image:
    needs: resolve_versions
    env:
      UI_VERSION: ${{ needs.resolve_versions.outputs.ui_version }}
    runs-on: ubuntu-22.04-arm
    name: build arm64 image
    steps:
      - uses: actions/checkout@v2
      - name: Check out specific tag when manually triggered
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --all && git checkout ${{ needs.resolve_versions.outputs.release_tag }}
      - name: Login docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.IMAGE_PUSH_USERNAME }}
          password: ${{ secrets.IMAGE_PUSH_TOKEN }}
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build arm64 image
        run: export ARCH=arm64; make docker-build && make docker-push
        env:
          IMAGE_PROJECT: ${{ secrets.RELEASE_IMAGE_PROJECT }}
          IMAGE_REPO: ${{ secrets.IMAGE_REPO }}
  push-manifests:
    runs-on: ubuntu-latest
    name: merge and push manifests
    needs:
      - resolve_versions
      - build-amd64-image
      - build-arm64-image
    steps:
      - uses: actions/checkout@v2
      - name: Check out specific tag when manually triggered
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --all && git checkout ${{ needs.resolve_versions.outputs.release_tag }}
      - name: Login docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.IMAGE_PUSH_USERNAME }}
          password: ${{ secrets.IMAGE_PUSH_TOKEN }}
      - name: push manifests
        run: make docker-push-manifest
        env:
          IMAGE_PROJECT: ${{ secrets.RELEASE_IMAGE_PROJECT }}
          IMAGE_REPO: ${{ secrets.IMAGE_REPO }}
  release:
    runs-on: ubuntu-latest
    name: release
    needs:
      - resolve_versions
      - push-manifests
    steps:
      - uses: actions/checkout@v2
      - name: Check out specific tag when manually triggered
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --all && git checkout ${{ needs.resolve_versions.outputs.release_tag }}
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: generate release artifacts
        run: make release
      - name: Generate draft release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          tag_name: ${{ needs.resolve_versions.outputs.release_tag }}
          name: Release ${{ needs.resolve_versions.outputs.release_tag }}
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
