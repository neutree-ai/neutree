name: release-engine-image-llama-cpp

# llama-cpp-python is CPU-only on the Neutree side, so this workflow has no
# accelerator input. Add an accelerator dimension here only when llama-cpp
# starts shipping accelerator-specific upstream variants.
on:
  workflow_dispatch:
    inputs:
      engine_version:
        description: "llama-cpp-python version (e.g. v0.3.7)"
        required: true
        type: string
      ray_version:
        description: "the ray version branch/tag to build from"
        required: false
        type: string
        default: "ray-2.53.0-neutree"
      ray_short_version:
        description: "ray short version for image tag (e.g: ray2.53.0)"
        required: false
        type: string
        default: "ray2.53.0"
      engine_patch_suffix:
        description: "optional raw Docker tag segment appended to the output tag (e.g. 'custom1' produces <engine_version>-custom1-<ray_short_version>); empty keeps the upstream tag; pass 'neutree1' explicitly for the legacy form"
        required: false
        type: string
        default: ""

jobs:
  build-amd64-image:
    runs-on: ["serve-builder","X64"]
    name: build amd64 llama-cpp engine image
    steps:
      - uses: actions/checkout@v2
      - name: Validate release inputs
        id: validate
        shell: bash
        env:
          ENGINE_VERSION: ${{ github.event.inputs.engine_version }}
          RAY_VERSION: ${{ github.event.inputs.ray_version }}
          RAY_REPO: https://github.com/neutree-ai/ray.git
          RAY_SHORT_VERSION: ${{ github.event.inputs.ray_short_version }}
          ENGINE_PATCH_SUFFIX: ${{ github.event.inputs.engine_patch_suffix }}
        run: |
          set -euo pipefail
          [[ "$ENGINE_VERSION" =~ ^v[A-Za-z0-9._-]+$ ]] || { echo "engine_version must start with v and match [A-Za-z0-9._-]+"; exit 1; }
          [[ -z "$ENGINE_PATCH_SUFFIX" || "$ENGINE_PATCH_SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "engine_patch_suffix must match [A-Za-z0-9._-]+"; exit 1; }
          [[ "$RAY_SHORT_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "ray_short_version must be a Docker tag segment"; exit 1; }
          [[ "$RAY_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$RAY_VERSION" != refs/* ]] || { echo "ray_version must be a safe branch or tag name"; exit 1; }
          git check-ref-format --branch "$RAY_VERSION" >/dev/null
          ray_commit="$(git ls-remote "$RAY_REPO" "refs/heads/$RAY_VERSION" "refs/tags/$RAY_VERSION" "refs/tags/$RAY_VERSION^{}" | awk 'index($2, "refs/tags/") == 1 && substr($2, length($2) - 2) == "^{}" { print $1; found=1; exit } index($2, "refs/heads/") == 1 { print $1; found=1; exit } NR == 1 { first=$1 } END { if (!found && first != "") print first }')"
          [[ "$ray_commit" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "ray_version does not resolve to a commit"; exit 1; }
          echo "ray_commit=$ray_commit" >> "$GITHUB_OUTPUT"
      - name: Login docker
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.SERVE_IMAGE_REPO }}
          username: ${{ secrets.SERVE_IMAGE_PUSH_USERNAME }}
          password: ${{ secrets.SERVE_IMAGE_PUSH_TOKEN }}
      - name: build and push engine image
        run: |
          cd cluster-image-builder
          make docker-build-engine-llama-cpp docker-push-engine-llama-cpp
        env:
          IMAGE_PROJECT: ${{ secrets.RELEASE_SERVE_IMAGE_PROJECT }}
          IMAGE_REPO: ${{ secrets.SERVE_IMAGE_REPO }}
          ARCH: amd64
          ENGINE_LLAMA_CPP_VERSION: ${{ github.event.inputs.engine_version }}
          RAY_VERSION: ${{ github.event.inputs.ray_version }}
          RAY_COMMIT: ${{ steps.validate.outputs.ray_commit }}
          RAY_SHORT_VERSION: ${{ github.event.inputs.ray_short_version }}
          ENGINE_PATCH_SUFFIX: ${{ github.event.inputs.engine_patch_suffix }}
  push-manifests:
    runs-on: ["serve-builder","X64"]
    name: merge and push llama-cpp manifests
    needs:
      - build-amd64-image
    steps:
      - uses: actions/checkout@v2
      - name: Login docker
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.SERVE_IMAGE_REPO }}
          username: ${{ secrets.SERVE_IMAGE_PUSH_USERNAME }}
          password: ${{ secrets.SERVE_IMAGE_PUSH_TOKEN }}
      - name: push manifests
        run: |
          cd cluster-image-builder
          make docker-push-manifest-engine-llama-cpp
        env:
          IMAGE_PROJECT: ${{ secrets.RELEASE_SERVE_IMAGE_PROJECT }}
          IMAGE_REPO: ${{ secrets.SERVE_IMAGE_REPO }}
          ALL_ARCH: amd64
          ENGINE_LLAMA_CPP_VERSION: ${{ github.event.inputs.engine_version }}
          RAY_SHORT_VERSION: ${{ github.event.inputs.ray_short_version }}
          ENGINE_PATCH_SUFFIX: ${{ github.event.inputs.engine_patch_suffix }}

  release-package:
    needs:
      - push-manifests
    uses: ./.github/workflows/release-engine-package.yaml
    with:
      engine: llama-cpp
      accelerator: cpu
      engine_version: ${{ github.event.inputs.engine_version }}
      ray_short_version: ${{ github.event.inputs.ray_short_version }}
      engine_patch_suffix: ${{ github.event.inputs.engine_patch_suffix }}
    secrets: inherit
